  <text x="180" y="137" class="badge-green">Active</text>
  <text x="62" y="172" class="card-title">Claude Code (Subscription)</text>
  <text x="62" y="198" class="label">MODELS</text>
  <text x="62" y="218" class="mono">• Sonnet / Opus / Fable / Haiku</text>
  <text x="62" y="238" class="mono">• Claude Fable 5.2 / Opus 5.5 / Sonnet 5.5 / Haiku 5.5</text>
  <text x="62" y="268" class="label">ISOLATION &amp; TRANSPORT</text>
  <text x="62" y="288" class="mono">• Strips ANTHROPIC_API_KEY from child processes</text>
