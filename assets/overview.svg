<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" role="img" aria-label="Buzz Subscription Harnesses on Windows 11">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <style>
      .title { font: 700 24px 'Segoe UI', system-ui, sans-serif; fill: #f0f6fc; }
      .subtitle { font: 400 14px 'Segoe UI', system-ui, sans-serif; fill: #8b949e; }
      .card-title { font: 600 18px 'Segoe UI', system-ui, sans-serif; fill: #f0f6fc; }
      .badge { font: 600 11px 'Consolas', monospace; fill: #58a6ff; }
