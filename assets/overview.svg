  <rect x="62" y="356" width="456" height="36" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="180" y="379" class="mono">Test Claude subscription ✓</text>

  <!-- Card 2: Cursor Agent -->
  <rect x="580" y="102" width="500" height="310" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="602" y="122" width="132" height="22" rx="6" fill="#1f2937" stroke="#3b82f6" stroke-width="1"/>
